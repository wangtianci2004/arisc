name: Update ARIS Research Skills

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-aris-research-skills
  cancel-in-progress: false

jobs:
  update:
    name: Refresh official ARIS gitlink
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out ARISC with submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fetch latest official research skills
        run: |
          git submodule sync -- aris-codex-skills
          git submodule update --init --remote --checkout --recursive -- aris-codex-skills

      - name: Commit updated gitlink
        run: |
          if git diff --quiet -- aris-codex-skills; then
            echo "ARIS research skills are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aris-codex-skills
          git commit -m "Update ARIS research skills"
          git push origin HEAD:main
