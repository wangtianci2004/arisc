name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Bash quality and smoke tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify bundled ARIS skills
        run: test -x aris-codex-skills/tools/install_aris_codex.sh

      - name: Install test dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck tmux

      - name: Install test dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash jq shellcheck tmux uv
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Check shell syntax
        run: make syntax

      - name: Run ShellCheck
        run: shellcheck --severity=error install.sh bin/* tests/*.sh

      - name: Run isolated smoke tests
        run: make smoke
